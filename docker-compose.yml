name: pollinoz-kuban
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pollinoz}
      POSTGRES_USER: ${POSTGRES_USER:-pollinoz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pollinoz}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-pollinoz}
      DEMO_MODE: ${DEMO_MODE:-false}
      OFFLINE: ${OFFLINE:-false}
      DEMO_ACCOUNTS_ENABLED: ${DEMO_ACCOUNTS_ENABLED:-true}
      FORECAST_URL: ${FORECAST_URL:-https://api.open-meteo.com/v1/forecast}
      ARCHIVE_URL: ${ARCHIVE_URL:-https://archive-api.open-meteo.com/v1/archive}
      CLINICAL_THRESHOLD: ${CLINICAL_THRESHOLD:-10}
      BUDGET_RUB: ${BUDGET_RUB:-198000000}
      IMPLEMENTATION_COST_RUB: ${IMPLEMENTATION_COST_RUB:-900000}
      WORKERS: ${WORKERS:-185}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      EDDS_MIS_API_KEY: ${EDDS_MIS_API_KEY:?Set EDDS_MIS_API_KEY in .env}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      ENABLE_LIVE_TELEGRAM: ${ENABLE_LIVE_TELEGRAM:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      UPLOAD_DIR: /app/data/uploads
      MODEL_PATH: /app/data/phenology.joblib
    volumes:
      - backend_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/v1/health', timeout=4).read()"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-80}:80"
volumes:
  postgres_data:
  backend_data:
